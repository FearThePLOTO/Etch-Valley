<svg width="800" height="220" viewBox="0 0 800 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">ETCH VALLEY banner</title>
<desc id="desc">Hand-made retro wood sign for ETCH VALLEY harvest sketch pad</desc>

<!-- paper background with subtle dots -->
<rect width="800" height="220" fill="#fdf6d8"/>
<g opacity="0.35">
  <circle cx="20" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="42" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="64" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="86" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="108" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="130" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="152" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="174" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="196" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="218" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="240" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="262" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="284" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="306" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="328" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="350" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="372" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="394" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="416" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="438" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="460" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="482" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="504" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="526" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="548" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="570" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="592" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="614" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="636" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="658" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="680" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="702" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="724" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="746" cy="20" r="1.5" fill="#e9d4b8"/><circle cx="768" cy="20" r="1.5" fill="#e9d4b8"/>
  <!-- random but simple - hand placed -->
</g>

<!-- wood sign shadow -->
<rect x="26" y="26" width="752" height="128" fill="#3b2213"/>

<!-- wood panel -->
<rect x="20" y="20" width="752" height="128" fill="#8b5a2b" stroke="#3b2213" stroke-width="4"/>
<!-- wood grain lines - hand drawn uneven -->
<g stroke="#6b3e1a" stroke-width="2" opacity="0.35" stroke-linecap="square">
  <line x1="20" y1="45" x2="772" y2="47"/><line x1="20" y1="68" x2="772" y2="70"/><line x1="20" y1="92" x2="772" y2="94"/><line x1="20" y1="118" x2="772" y2="120"/>
  <line x1="40" y1="20" x2="40" y2="148" opacity="0.18" stroke-width="1.5"/><line x1="120" y1="20" x2="120" y2="148" opacity="0.18" stroke-width="1.5"/><line x1="210" y1="20" x2="210" y2="148" opacity="0.18" stroke-width="1"/><line x1="340" y1="20" x2="340" y2="148" opacity="0.18" stroke-width="1"/><line x1="500" y1="20" x2="500" y2="148" opacity="0.18" stroke-width="1.5"/><line x1="660" y1="20" x2="660" y2="148" opacity="0.18" stroke-width="1"/>
</g>
<!-- inner highlight -->
<rect x="20" y="20" width="752" height="6" fill="white" opacity="0.14"/>
<rect x="20" y="142" width="752" height="6" fill="black" opacity="0.18"/>

<!-- nails at corners -->
<g fill="#2b1d12" stroke="#1a110a" stroke-width="2">
  <circle cx="32" cy="32" r="6"/><circle cx="760" cy="32" r="6"/><circle cx="32" cy="136" r="6"/><circle cx="760" cy="136" r="6"/>
  <circle cx="33" cy="33" r="1.2" fill="white" opacity="0.25" stroke="none"/>
  <circle cx="761" cy="33" r="1.2" fill="white" opacity="0.25" stroke="none"/>
</g>

<!-- logo block - pixel sun + field -->
<g transform="translate(44,46)">
  <rect width="56" height="56" fill="#fdf6d8" stroke="#3b2213" stroke-width="3"/>
  <!-- shadow -->
  <rect x="3" y="3" width="56" height="56" fill="none" stroke="#3b2213" stroke-width="1" opacity="0.0"/>
  <!-- sun strip -->
  <rect width="56" height="22" fill="#e9c46a" stroke="#3b2213" stroke-width="2.5"/>
  <rect x="7" y="5" width="10" height="10" fill="#fff8a0" stroke="#3b2213" stroke-width="0.8"/>
  <rect x="22" y="7" width="8" height="6" fill="#fff8a0" opacity="0.95"/>
  <rect x="33" y="5" width="5" height="5" fill="white" opacity="0.55"/>
  <!-- field 4x2 -->
  <g transform="translate(0,22)">
    <rect width="14" height="17" fill="#a3d977" stroke="#3b2213" stroke-width="0.7"/><rect x="14" width="14" height="17" fill="#5a8a3a" stroke="#3b2213" stroke-width="0.7"/><rect x="28" width="14" height="17" fill="#a3d977" stroke="#3b2213" stroke-width="0.7"/><rect x="42" width="14" height="17" fill="#5a8a3a" stroke="#3b2213" stroke-width="0.7"/>
    <rect y="17" width="14" height="17" fill="#5a8a3a" stroke="#3b2213" stroke-width="0.7"/><rect x="14" y="17" width="14" height="17" fill="#a3d977" stroke="#3b2213" stroke-width="0.7"/><rect x="28" y="17" width="14" height="17" fill="#5a8a3a" stroke="#3b2213" stroke-width="0.7"/><rect x="42" y="17" width="14" height="17" fill="#a3d977" stroke="#3b2213" stroke-width="0.7"/>
  </g>
</g>

<!-- title text - hand-made pixel feel, use monospace block -->
<g font-family="'Courier New', Courier, monospace" >
  <!-- shadow for title -->
  <text x="118" y="82" font-size="38" font-weight="900" fill="#2b1d12" letter-spacing="1.5" >ETCH VALLEY</text>
  <text x="116" y="80" font-size="38" font-weight="900" fill="#fff8dc" letter-spacing="1.5" stroke="#3b2213" stroke-width="0.6">ETCH VALLEY</text>
  <!-- subtitle - matches html title-wrap p -->
  <text x="118" y="108" font-size="11" font-weight="700" fill="#fde8a0" letter-spacing="1.2" opacity="0.98">ETCH-A-SKETCH PAD  -  v1.0  -  DRAW PIXELS</text>
</g>

<!-- right score boxes -->
<g transform="translate(550,52)">
  <rect width="96" height="44" fill="#fdf6d8" stroke="#3b2213" stroke-width="3"/>
  <rect x="3" y="3" width="96" height="44" fill="none" stroke="#3b2213" stroke-width="1" opacity="0.0"/>
  <text x="48" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" font-weight="700" fill="#7a4a1f" letter-spacing="0.8">FIELD SIZE</text>
  <text x="48" y="32" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" font-weight="900" fill="#3b2213">16 x 16</text>
</g>
<g transform="translate(660,52)">
  <rect width="96" height="44" fill="#fdf6d8" stroke="#3b2213" stroke-width="3"/>
  <text x="48" y="16" text-anchor="middle" font-family="'Courier New', monospace" font-size="7" font-weight="700" fill="#7a4a1f" letter-spacing="0.8">Auth</text>
  <text x="48" y="32" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="900" fill="#3b2213">PLOTO★</text>
</g>

<!-- tassels below wood - little diamonds -->
<g transform="translate(0,148)">
  <g fill="#e9c46a" stroke="#3b2213" stroke-width="1.7">
    <rect x="130" y="2" width="13" height="13" transform="rotate(45 136.5 8.5)"/><rect x="154" y="2" width="13" height="13" transform="rotate(45 160.5 8.5)" fill="#a3d977"/><rect x="178" y="2" width="13" height="13" transform="rotate(45 184.5 8.5)"/><rect x="202" y="2" width="13" height="13" transform="rotate(45 208.5 8.5)" fill="#a3d977"/><rect x="226" y="2" width="13" height="13" transform="rotate(45 232.5 8.5)"/><rect x="250" y="2" width="13" height="13" transform="rotate(45 256.5 8.5)" fill="#a3d977"/><rect x="274" y="2" width="13" height="13" transform="rotate(45 280.5 8.5)"/><rect x="298" y="2" width="13" height="13" transform="rotate(45 304.5 8.5)" fill="#a3d977"/><rect x="322" y="2" width="13" height="13" transform="rotate(45 328.5 8.5)"/><rect x="346" y="2" width="13" height="13" transform="rotate(45 352.5 8.5)" fill="#a3d977"/><rect x="370" y="2" width="13" height="13" transform="rotate(45 376.5 8.5)"/><rect x="394" y="2" width="13" height="13" transform="rotate(45 400.5 8.5)" fill="#a3d977"/><rect x="418" y="2" width="13" height="13" transform="rotate(45 424.5 8.5)"/><rect x="442" y="2" width="13" height="13" transform="rotate(45 448.5 8.5)" fill="#a3d977"/><rect x="466" y="2" width="13" height="13" transform="rotate(45 472.5 8.5)"/><rect x="490" y="2" width="13" height="13" transform="rotate(45 496.5 8.5)" fill="#a3d977"/>
  </g>
</g>

<!-- tiny footer - matches html bottom-planks -->
<text x="400" y="188" text-anchor="middle" font-family="'Courier New', monospace" font-size="7.5" fill="#7a4a1f" letter-spacing="1.2" opacity="0.85">MADE WITH SOIL &amp; PIXELS  -  © 2026 FearThePLOTO for The Odin Project</text>
</svg>
